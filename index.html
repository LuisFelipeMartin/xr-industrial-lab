<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Laboratorio XR - Entorno Industrial Multiplataforma</title>

  <!-- PARTE A: Actualizamos a A-Frame v1.5.0 para mejor compatibilidad WebXR en Android -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>

    <!-- ======================================================= -->
    <!-- PARTE D: CARGA DE RECURSOS (a-assets)                  -->
    <!-- ======================================================= -->
    <a-assets>
      <a-asset-item id="modeloCAD" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- ENTORNO Y PISO INDUSTRIAL -->
    <a-sky color="#B0BEC5"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#37474F"></a-plane>
    <a-plane position="0 0.01 -2" rotation="-90 0 0" width="8" height="6" color="#FBC02D"></a-plane>
    <a-plane position="0 0.02 -2" rotation="-90 0 0" width="7.6" height="5.6" color="#455A64"></a-plane>

    <!-- ======================================================= -->
    <!-- PARTE C: CELDA DE MANUFACTURA CON PRIMITIVAS           -->
    <!-- ======================================================= -->
    <a-entity id="celda-primitivas" position="-2 0 -2">
      <!-- Tanque -->
      <a-cylinder position="-1 1.25 0" radius="0.6" height="2.5" color="#0288D1" opacity="0.85"></a-cylinder>
      <a-sphere position="-1 2.5 0" radius="0.6" color="#0277BD"></a-sphere>
      <a-sphere position="-1 3.2 0" radius="0.1" color="#4CAF50"></a-sphere>

      <!-- Banda transportadora -->
      <a-box position="1 0.5 0" width="0.8" height="0.1" depth="2.5" color="#546E7A"></a-box>
      <a-box position="1 0.56 0" width="0.7" height="0.02" depth="2.4" color="#111111"></a-box>
      <a-box position="1 0.75 -0.5" width="0.3" height="0.3" depth="0.3" color="#FB8C00"></a-box>
      <a-box position="1 0.75 0.5" width="0.3" height="0.3" depth="0.3" color="#FB8C00"></a-box>

      <!-- Panel de Control -->
      <a-box position="0 0.6 -1" width="0.3" height="1.2" depth="0.3" color="#37474F"></a-box>
      <a-box position="0 1.2 -0.95" rotation="-20 0 0" width="0.5" height="0.3" depth="0.05" color="#1E88E5"></a-box>
      <a-cylinder position="0.15 1.15 -0.9" rotation="70 0 0" radius="0.03" height="0.03" color="#E53935"></a-cylinder>
    </a-entity>

    <!-- ======================================================= -->
    <!-- PARTE D: MODELO CAD                                     -->
    <!-- ======================================================= -->
    <a-entity 
      gltf-model="#modeloCAD" 
      position="-11.153 1.407 10.593" 
      rotation="0 -45 0" 
      scale="20 20 20">
    </a-entity>

    <!-- ======================================================= -->
    <!-- CÁMARA Y CONTROLES BÁSICOS (Simplificado para evitar conflictos) -->
    <!-- ======================================================= -->
    <!-- Al usar a-camera directamente, A-Frame inyecta WebXR de forma nativa -->
    <a-camera position="0 1.6 2">
      <a-cursor color="#FF5722"></a-cursor>
    </a-camera>

    <!-- Controles VR -->
    <a-entity laser-controls="hand: right"></a-entity>
    <a-entity laser-controls="hand: left"></a-entity>

  </a-scene>
</body>
</html>
