<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parte D - Integración Modelo CAD (XR Multiplataforma)</title>

  <!-- Librería A-Frame v1.4.1 -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene visual-filtering>

    <!-- ======================================================= -->
    <!-- PARTE D: CARGA DE RECURSOS (a-assets)                  -->
    <!-- ======================================================= -->
    <a-assets>
      <!-- Definición del recurso GLB -->
      <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- CIELO Y PISO INDUSTRIAL -->
    <a-sky color="#B0BEC5"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#37474F"></a-plane>

    <!-- ======================================================= -->
    <!-- PARTE C: CELDA DE MANUFACTURA CON PRIMITIVAS           -->
    <!-- ======================================================= -->
    <a-entity id="celda-primitivas" position="-2.5 0 -3">
      <!-- Tanque de almacenamiento -->
      <a-cylinder position="0 1.5 0" radius="0.6" height="2" color="#0288D1" opacity="0.85"></a-cylinder>
      <a-sphere position="0 2.5 0" radius="0.6" color="#0277BD"></a-sphere>
      <!-- Banda transportadora -->
      <a-box position="1.5 0.5 0" width="2" height="0.1" depth="0.8" color="#546E7A"></a-box>
      <a-box position="1.5 0.65 0" width="0.3" height="0.2" depth="0.3" color="#FB8C00"></a-box>
    </a-entity>

    <!-- ======================================================= -->
    <!-- PARTE D: INTEGRACIÓN DEL MODELO CAD EXTERNO (.GLB)     -->
    <!-- ======================================================= -->
    <!-- Ajusta position, scale y rotation según las dimensiones de tu modelo -->
    <a-entity 
      gltf-model="#modeloIndustrial" 
      position="2 0 -3" 
      rotation="0 -30 0" 
      scale="1 1 1">
    </a-entity>


    <!-- ======================================================= -->
    <!-- CÁMARA Y CONTROLES (PC, MÓVIL Y VR)                    -->
    <!-- ======================================================= -->
    <a-entity position="0 1.6 1">
      <a-camera look-controls wasd-controls>
        <!-- Retícula/Cursor para interacción con la mirada o clic -->
        <a-cursor color="#FF5722" raycaster="objects: .interactivo"></a-cursor>
      </a-camera>
    </a-entity>

    <!-- Controles tipo rayo láser para Meta Quest u otros visores VR -->
    <a-entity laser-controls="hand: right"></a-entity>
    <a-entity laser-controls="hand: left"></a-entity>

  </a-scene>
</body>
</html>
