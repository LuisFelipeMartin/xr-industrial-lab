<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Laboratorio XR - Entorno Industrial Multiplataforma</title>

  <!-- Librería A-Frame v1.5.0 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  
  <!-- Botón Azul para confirmación de despliegue en GitHub Pages -->
  <button id="boton-vr" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 15px 25px; background-color: #007bff; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; box-shadow: 0px 4px 6px rgba(0,0,0,0.3);">
    ENTRAR A VR
  </button>

  <a-scene 
    device-orientation-permission-ui="enabled: true"
    vr-mode-ui="enabled: false">

    <!-- assets -->
    <a-assets>
      <a-asset-item id="modeloCAD" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- ENTORNO Y PISO INDUSTRIAL -->
    <a-sky color="#B0BEC5"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#37474F"></a-plane>
    <a-plane position="0 0.01 -2" rotation="-90 0 0" width="8" height="6" color="#FBC02D"></a-plane>
    <a-plane position="0 0.02 -2" rotation="-90 0 0" width="7.6" height="5.6" color="#455A64"></a-plane>

    <!-- CELDA DE MANUFACTURA -->
    <a-entity id="celda-primitivas" position="-2 0 -2">
      <!-- Tanque sin opacidad para evitar fallos de mezcla alpha en estéreo -->
      <a-cylinder position="-1 1.25 0" radius="0.6" height="2.5" color="#0288D1"></a-cylinder>
      <a-sphere position="-1 2.5 0" radius="0.6" color="#0277BD"></a-sphere>
      <a-sphere position="-1 3.2 0" radius="0.1" color="#4CAF50"></a-sphere>

      <!-- Banda transportadora -->
      <a-box position="1 0.5 0" width="0.8" height="0.1" depth="2.5" color="#546E7A"></a-box>
      <a-box position="1 0.56 0" width="0.7" height="0.02" depth="2.4" color="#111111"></a-box>
      <a-box position="1 0.75 -0.5" width="0.3" height="0.3" depth="0.3" color="#FB8C00"></a-box>
      <a-box position="1 0.75 0.5" width="0.3" height="0.3" depth="0.3" color="#FB8C00"></a-box>

      <!-- Panel de Control -->
      <a-box position="0 0.6 -1" width="0.3" height="1.2" depth="0.3" color="#37474F"></a-box>
      <a-box position="0 1.2 -0.95" rotation="-20 0 0" width="0.5" height="0.3" depth="0.05" color="#1E88E5"></a-box>
      <a-cylinder position="0.15 1.15 -0.9" rotation="70 0 0" radius="0.03" height="0.03" color="#E53935"></a-cylinder>
    </a-entity>

    <!-- MODELO CAD -->
    <a-entity 
      gltf-model="#modeloCAD" 
      position="-11.153 1.407 10.593" 
      rotation="0 -45 0" 
      scale="20 20 20">
    </a-entity>

    <!-- CÁMARA CON CORRECCIÓN DE RECORTE CERCANO -->
    <a-camera position="0 1.6 2" near="0.1" far="1000">
      <a-cursor color="#FFFFFF" radius-inner="0.01" radius-outer="0.02"></a-cursor>
    </a-camera>

  </a-scene>

  <script>
    var boton = document.querySelector('#boton-vr');
    var escena = document.querySelector('a-scene');

    boton.addEventListener('click', function() {
      if (escena.is('vr-mode')) {
        escena.exitVR();
      } else {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(permissionState => {
              if (permissionState === 'granted') {
                escena.enterVR();
              }
            })
            .catch(console.error);
        } else {
          escena.enterVR();
        }
      }
    });

    escena.addEventListener('enter-vr', function () {
      boton.innerText = 'SALIR DE VR';
      boton.style.left = '20px';
      boton.style.transform = 'none';
      boton.style.backgroundColor = '#004085'; // Azul oscuro al estar activo
    });

    escena.addEventListener('exit-vr', function () {
      boton.innerText = 'ENTRAR A VR';
      boton.style.left = '50%';
      boton.style.transform = 'translateX(-50%)';
      boton.style.backgroundColor = '#007bff'; // Azul brillante
    });
  </script>
</body>
</html>
